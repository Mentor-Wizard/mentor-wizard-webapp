name: '🪄 Mentor Wizard | 🚀 Deploy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: '🚀 Deploy to ${{ github.event.inputs.environment }}'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: '🔒 Generate known_hosts'
        id: known-hosts
        run: |
          echo "known_hosts=$(ssh-keyscan -H ${{ secrets.SERVER_HOST }})" >> $GITHUB_OUTPUT

      - name: '🔑 Set up SSH'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa # optional
          if_key_exists: replace
          known_hosts: ${{ steps.known-hosts.outputs.known_hosts }}

      - name: '🔄 Create .env file from secrets'
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: '🏗️ Build Docker image'
        run: |
          docker build -t mentor-wizard-app:latest -f docker/php/Dockerfile .

      - name: '🔄 Copy files to server'
        run: |
          rsync -avz --exclude='.git' --exclude='node_modules' --exclude='vendor' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}

      - name: '🔄 Copy .env file to server'
        run: |
          scp .env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/.env

      - name: '🛑 Enable maintenance mode'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ${{ secrets.SERVER_PATH }} && docker compose exec -T app php artisan down"

      - name: '🔄 Run database migrations'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ${{ secrets.SERVER_PATH }} && docker compose exec -T app php artisan migrate --force"

      - name: '🔄 Restart Docker containers'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ${{ secrets.SERVER_PATH }} && docker compose -f docker-compose.staging.yml down && docker compose -f docker-compose.staging.yml up -d"

      - name: '✅ Disable maintenance mode'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ${{ secrets.SERVER_PATH }} && docker compose exec -T app php artisan up"
        if: success()

      - name: '❌ Notify on failure'
        if: failure()
        run: |
          echo "Deployment failed. Please check the logs for more information."

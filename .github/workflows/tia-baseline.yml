name: '🪄 Mentor Wizard | 🧭 TIA Baseline'

# Records Pest 5's Test Impact Analysis (TIA) baseline and publishes it as a workflow artifact.
# This does NOT speed up ci.yml — per Pest's Continuous Integration docs, `--tia` must never be
# used in the pipeline that gates pull requests, since it replays cached results for unaffected
# tests instead of running them. This workflow is the one documented exception: a dedicated job,
# separate from the PR gate, that records a fresh baseline after every merge to develop so that
# developers running `./vendor/bin/pest` (or `php artisan test`) locally can download it via `gh`
# and start replaying immediately instead of paying the full local record cost themselves.
#
# tests/Pest.php already wires this up end-to-end via `pest()->tia()->locally()->baselined()`,
# so no further setup is needed once this workflow has run at least once. Every command in
# ci.yml passes `--ci`, which is how Pest's `locally()` check distinguishes "this is CI" from
# "this is a developer's machine" (it does not look at $GITHUB_ACTIONS or similar — see the
# comment above the `tests:` job in ci.yml) — so TIA never engages in the PR gate.

on:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  baseline:
    name: '🧭 Record TIA baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine3.20
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v6

      - name: '⚙️ Prepare environment'
        uses: ./.github/actions/setup-environment
        with:
          use-php: true
          use-node: true

      - name: '🗄️ Grant CREATEDB permission'
        run: PGPASSWORD=db psql -h 127.0.0.1 -U db -d testing -c "ALTER USER db CREATEDB;"

      - name: '🧭 Run full suite and record TIA graph'
        run: ./vendor/bin/pest --parallel --tia --coverage --fresh
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: db
          DB_PASSWORD: db

      - name: '📍 Resolve TIA baseline path'
        id: baseline
        run: echo "path=$(./vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

      - name: '⬆️ Upload TIA baseline'
        uses: actions/upload-artifact@v4
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline.outputs.path }}
          include-hidden-files: true
          retention-days: 30

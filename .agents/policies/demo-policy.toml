# Правило 1: Дозволяємо субагенту виконувати команду створення PR через GitHub CLI
[[rules]]
subagent = "pr-creator"
action = "allow"

[rules.match]
tool = "run_shell_command"
args = { "command" = "gh pr create.*" }

# Правило 2: Дозволяємо субагенту безпечні команди git
[[rules]]
subagent = "pr-creator"
action = "allow"

[rules.match]
tool = "run_shell_command"
args = { "command" = "git (add|commit|status|push).*" }

# Правило 3: Блокуємо для цього ж субагента будь-які ІНШІ shell-команди
[[rules]]
subagent = "pr-creator"
action = "deny"

[rules.match]
tool = "run_shell_command"

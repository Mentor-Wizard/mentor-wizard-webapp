name: Deploy To Staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    name: Deploy staging from ${{ github.event.inputs.branch }}
    runs-on: mw-staging
    environment:
      name: staging

    steps:
      - name: Ensure workspace log directory permissions
        run: |
          # Define the path to the working directory
          WORKSPACE_PATH="${{ github.workspace }}"
          LOG_DIR="$WORKSPACE_PATH/storage/logs"
          # Check if the directory exists and change owner/permissions
          if [ -d "$LOG_DIR" ]; then
            echo "Fixing permissions for $LOG_DIR..."
            # Use id -u and id -g to get the current UID/GID of the runner user
            sudo chown -R $(id -u):$(id -g) "$LOG_DIR"
            sudo chmod -R u+w "$LOG_DIR" # Add write permissions for the owner
          else
            echo "Log directory $LOG_DIR does not exist, skipping permission fix."
          fi
        continue-on-error: true # Continue even if there's an error here (e.g., sudo not available)

      - name: Export UID:GID
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV
        # This ensures that docker commands are executed with the correct user permissions on the host

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }} # Get code from the specified branch
          clean: false

      - name: Create .env file
        run: |
          # Always create a fresh .env file from secrets
          echo "Creating .env file from secrets..."
          echo "${{ secrets.ENV_FILE }}" > .env
          # Ensure the .env file exists in the Docker build context
          ls -la .env

      - name: Deploy Application
        env:
          UID: ${{ env.UID }}
          GID: ${{ env.GID }}
        run: |
          # Stop existing services and remove orphaned containers
          echo "Stopping existing containers..."
          docker compose -f docker-compose.staging.yml down --remove-orphans

          # Build images (if Dockerfile changed) and start services in the background
          echo "Building and starting containers..."
          docker compose -f docker-compose.staging.yml up -d --build

          # Wait for services to initialize
          echo "Waiting for services to initialize..."
          docker compose -f docker-compose.staging.yml wait db app webserver redis

          # Check if SSL certificates exist, if not create them
          echo "Checking SSL certificates..."
          if [ ! -f "/etc/letsencrypt/live/mentor-wizard.com/fullchain.pem" ]; then
            echo "SSL certificates not found, generating..."
            docker compose -f docker-compose.staging.yml exec webserver mkdir -p /etc/letsencrypt/live/mentor-wizard.com
            docker compose -f docker-compose.staging.yml exec app certbot certonly --standalone --staging --non-interactive --agree-tos --email mentor.wizard.ua@gmail.com -d mentor-wizard.com || true
          fi

          # Put the application in maintenance mode
          echo "Entering maintenance mode..."
          docker compose -f docker-compose.staging.yml exec app php artisan down || true

          # Run database migrations
          echo "Running database migrations..."
          docker compose -f docker-compose.staging.yml exec app php artisan migrate --force

          # Optimize Laravel (cache configuration, routes, views)
          echo "Optimizing application..."
          docker compose -f docker-compose.staging.yml exec app php artisan optimize:clear # First clear the old cache
          docker compose -f docker-compose.staging.yml exec app php artisan optimize       # Create new cache

          # Take the application out of maintenance mode
          echo "Exiting maintenance mode..."
          docker compose -f docker-compose.staging.yml exec app php artisan up

          echo "Deployment to staging successful!"

      - name: Health Check
        run: |
          echo "Performing health check..."
          max_attempts=5
          attempt=1
          until curl -s -f https://mentor-wizard.com/up || [ $attempt -eq $max_attempts ]
          do
            echo "Health check attempt $attempt of $max_attempts failed, waiting 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "Health check failed after $max_attempts attempts"
            exit 1
          fi
          echo "Health check passed successfully!"

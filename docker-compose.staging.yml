services:
    db:
        image: postgres:17-alpine3.20
        restart: unless-stopped
        container_name: mw-db
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - 5432:5432
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - mw-db-network
        healthcheck:
            test: pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}
            interval: 5s
            timeout: 10s
            retries: 20

    app:
        &app
        build:
            context: ./
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        container_name: mw-app
        environment:
            COMMAND: php artisan octane:start --host=0.0.0.0 --port=8000
            PROCESS: app
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "8000:8000"
        networks:
            - mw-db-network
            - mw-webserver-network
            - mw-redis-network
#        healthcheck:
#            test: curl -s http://localhost:8000/up >/dev/null || exit 1
#            interval: 5s
#            timeout: 10s
#            retries: 20

    workers:
        <<: *app
        container_name: mw-worker
        environment:
            COMMAND: php artisan queue:work
            PROCESS: worker
        ports: []
        networks:
            - mw-db-network
            - mw-redis-network

    schedule:
        <<: *app
        container_name: mw-schedule
        environment:
            COMMAND: supercronic -quiet /var/www/docker/php/schedule/schedule
            PROCESS: schedule
        networks:
            - mw-db-network
            - mw-redis-network
        ports: []
        healthcheck:
            test: supercronic -test /var/www/docker/php/schedule/schedule | grep -q 'is valid' # TODO try spatie LARAVEL-HEALTH
            interval: 5s
            timeout: 10s
            retries: 2

    websockets:
        <<: *app
        container_name: mw-websockets
        environment:
            COMMAND: php artisan reverb:start --host="0.0.0.0" --port=8080 --hostname="localhost" --debug
            PROCESS: reverb
        ports:
            - "8080:8080"
        networks:
            - mw-db-network
            - mw-redis-network

    webserver:
        image: nginx:1.26.0-alpine
        container_name: mw-webserver
        restart: unless-stopped
        volumes:
            - ./docker/nginx/conf.d/app-staging.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt
            - ./storage/logs/nginx/:/var/log/nginx/
        ports:
            - 80:80
            - 443:443
        networks:
            - mw-webserver-network
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: curl -s http://localhost/up >/dev/null || exit 1
            interval: 5s
            timeout: 10s
            retries: 20

    redis:
        image: redis:7.2.4-alpine
        restart: unless-stopped
        container_name: mw-redis
        command:
            - 'redis-server'
            - '--requirepass ${REDIS_PASSWORD}'
        volumes:
            - redis_data:/data
        networks:
            - mw-redis-network
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 10s
            retries: 20

volumes:
    db_data:
        driver: local
        name: mw_db_data
    redis_data:
        driver: local
        name: mw_redis_data
    mw_app_composer_data:
        driver: local
        name: mw_app_composer_data
    mw_app_npm_data:
        driver: local
        name: mw_app_npm_data

networks:
    mw-db-network:
        driver: bridge
        name: mw-db-network
    mw-webserver-network:
        driver: bridge
        name: mw-webserver-network
    mw-redis-network:
        driver: bridge
        name: mw-redis-network

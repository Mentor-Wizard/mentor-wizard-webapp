services:
  db:
    image: postgres:17-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - '5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    command:
      - 'redis-server'
      - '--requirepass ${REDIS_PASSWORD}'
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 10s
      retries: 20

  app: &app
#    build:
#      context: ../
#      dockerfile: .docker/dev/php/Dockerfile
#      args:
#        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
#        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
#        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
#        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    image: ghcr.io/mentor-wizard/mentor-wizard-webapp:dev
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: 'true'
      AUTORUN_LARAVEL_MIGRATION: 'true'
      AUTORUN_LARAVEL_STORAGE_LINK: 'true'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../files/storage/logs:/var/www/html/storage/logs
      - ../../files/storage/app:/var/www/html/storage/app
    command: ['php', 'artisan', 'octane:start', '--server=frankenphp', '--host=0.0.0.0', '--port=8080']
    expose:
      - '8080'
      - '8443'
    healthcheck:
      test: ['CMD', 'healthcheck-octane']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    post_start:
      - command: chown -R www-data:www-data /var/www/html/storage && chmod -R 775 /var/www/html/storage
        user: root

  workers:
    <<: *app
    environment:
      AUTORUN_ENABLED: 'false'
    command: ['php', 'artisan', 'queue:work', '--sleep=1', '--tries=3', '--max-time=3600']
    expose: []
    healthcheck:
      disable: true
    labels:
      - 'traefik.enable=false'

  websockets:
    <<: *app
    environment:
      AUTORUN_ENABLED: 'false'
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080', '--debug']
    expose:
      - '8080'
    healthcheck:
      disable: true

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_UI_AUTH: ${MP_UI_AUTH}
    expose:
      - '1025'
      - '8025'

volumes:
  db_data:
  redis_data:

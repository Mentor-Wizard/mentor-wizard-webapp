name: '🪄 Mentor Wizard | 🔄 CI'

on:
  push:
    branches:
      - develop
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - develop
      - feature/*
      - fix/*
      - hotfix/*
      - epic/*
      - release/*
    paths-ignore:
      - README.md

  workflow_dispatch:

jobs:
  cleanup:
    name: '🧹 Clean up GitHub repo'
    runs-on: ubuntu-latest
    permissions: write-all
    if: github.event_name != 'pull_request'

    steps:
      - name: '🗑 Delete workflow runs'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 1
          delete_workflow_pattern: ci.yml

  lints:
    name: '🪄 Lints | ${{ matrix.command.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine3.20
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        command:
          - {
              name: '🔍 PHPStan',
              command: './vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=2G',
              php: true,
            }
          - {
              name: '🧽 Laravel Pint',
              command: './vendor/bin/pint --test --cache-file=var/cache/pint/pint.cache --ansi --format=checkstyle | cs2pr',
              php: true,
            }
          - {
              name: '🏠 Rector',
              command: './vendor/bin/rector process --dry-run --no-progress-bar --output-format=github --ansi',
              php: true,
            }
          - {
              name: '🅿️ Prettier',
              command: 'yarn prettier',
              node: true,
            }
          - {
            name: '🔯 Eslint',
            command: 'yarn eslint',
            node: true,
          }

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v6

      - name: '⚙️ Prepare environment'
        uses: ./.github/actions/setup-environment
        with:
          use-php: ${{ matrix.command.php }}
          use-node: ${{ matrix.command.node }}

      - name: ${{ matrix.command.name }}
        run: ${{ matrix.command.command }}
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: db
          DB_PASSWORD: db

  # Pest 5's Test Impact Analysis (TIA, --tia) is deliberately NOT used anywhere in this job
  # (or the mutation job below), and tests/Pest.php deliberately does NOT call
  # pest()->tia()->locally() either — see the comment block at the top of tests/Pest.php for
  # why that global config was considered and rejected (it would make the CI gate's safety
  # depend on every future command remembering to pass `--ci`, forever, for a feature that only
  # benefits local runs). Per Pest's own Continuous Integration docs, `--tia` replays cached
  # results for unaffected tests instead of running them — the docs explicitly say this belongs
  # only in a dedicated baseline-recording workflow, never in the pipeline that gates pull
  # requests. See .github/workflows/tia-baseline.yml for where TIA is applied instead (local
  # developer speed, opt-in per command, not CI speed).
  #
  # `--ci` is still added to every `php artisan test` invocation below (and in the mutation job)
  # on its own merits: it ignores ->only()/->skip() focus markers, so a test file accidentally
  # committed with `->only()` can't silently shrink what CI runs. This is also Pest's own
  # canonical CI example (`./vendor/bin/pest --ci`) — a pre-existing gap in this workflow, closed
  # here rather than left for later.
  tests:
    name: '♻️ Tests | ${{ matrix.command.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.command.timeout || 20 }}

    services:
      postgres:
        image: postgres:17-alpine3.20
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Unit is split into 2 native Pest shards (--shard=N/2) since it is the larger suite
    # (139 files / 1130 tests vs Feature's 55 files). --shard+--parallel was verified locally
    # (no DB needed): `--list-tests` confirmed a complete, non-overlapping split of
    # --testsuite=Unit (548 + 582 = 1130 tests, zero overlap), and a live run printed
    # "Shard: 1 of 2 — 70 files ran, out of 139" with no filter-length error, confirming
    # Shard.php (vendor/pestphp/pest/src/Plugins/Shard.php) filters by class name — compact
    # enough to stay well under its --filter length cap. --shard partitions by count (no
    # tests/.pest/shards.json committed yet); 2 shards is a conservative starting point without
    # per-shard timing data — each shard repeats the full setup-environment cost, including
    # `yarn build` (see .github/actions/setup-environment/action.yml), so this is expected to
    # pay back on Unit's size but should be revisited once real per-shard durations are visible.
    # Feature and Coverage stay unsharded: Feature is small enough that another shard's fixed
    # overhead would likely outweigh the split, and Coverage produces a single Clover report
    # consumed by Codecov (see the two upload steps below) — sharding it would need per-shard
    # flags/report merging, which isn't worth it for one job.
    strategy:
      fail-fast: false
      matrix:
        command:
          - { name: '🔬 Unit (1/2)', command: 'php artisan test --ci --testsuite=Unit --parallel --shard=1/2',                          report: false }
          - { name: '🔬 Unit (2/2)', command: 'php artisan test --ci --testsuite=Unit --parallel --shard=2/2',                          report: false }
          - { name: '🧬 Feature',    command: 'php artisan test --ci --testsuite=Feature --parallel',                                   report: false }
          - { name: '☂️ Coverage',   command: 'php artisan test --ci --coverage --compact --coverage-clover coverage/coverage-clover.xml --log-junit coverage/junit.xml', report: true  }

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v6

      - name: '⚙️ Prepare environment'
        uses: ./.github/actions/setup-environment
        with:
          use-node: true

      - name: '🗄️ Grant CREATEDB permission'
        run: PGPASSWORD=db psql -h 127.0.0.1 -U db -d testing -c "ALTER USER db CREATEDB;"

      - name: '${{ matrix.command.name }} tests'
        run: ${{ matrix.command.command }}
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: db
          DB_PASSWORD: db

      - name: '☂️ Upload results to Codecov'
        if: ${{ !cancelled() && matrix.command.report }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Mentor-Wizard/mentor-wizard-webapp
          flags: ${{ matrix.command.name }}
          directory: ./coverage
          files: ./coverage/coverage-clover.xml
          verbose: true
          name: codecov-report
          commit_parent: ${{ github.event.pull_request.base.sha }}

      - name: '☂️ Upload test results to Codecov'
        if: ${{ !cancelled() && matrix.command.report }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.command.name }}
          directory: ./coverage
          fail_ci_if_error: true
          report_type: test_results

  # Mutation testing is sharded by app/ subdirectory so shards run concurrently instead of
  # a single job mutating the whole app/ tree sequentially (was timing out with 73 Action
  # classes plus ~70 more across Http/Services/Enums/etc. all mutated in one sequential run).
  # --path accepts a comma-separated list of directories (see
  # vendor/pestphp/pest-plugin-mutate/src/Support/Configuration/CliConfiguration.php).
  # The four paths below cover every top-level app/ directory (verified against `ls app/`),
  # so no class is silently excluded from mutation.
  #
  # Native Pest 5 `--shard` was evaluated as a replacement and rejected: `--shard` (see
  # vendor/pestphp/pest/src/Plugins/Shard.php) partitions by which *test files* run, while
  # `--mutate --covered-only` derives its mutation target classes from the covers()/mutates()
  # declarations of whichever tests actually ran (vendor/pestphp/pest-plugin-mutate/src/Support/
  # Configuration/Configuration.php). Pest ships no documented or tested integration between
  # the two, and pest-plugin-mutate's own sources contain no shard-awareness. Splitting the
  # *test* set by time-balance and then asking `--covered-only` to mutate whatever classes
  # happen to be covered by that subset risks a shard passing `--min=100` while covering only
  # a fraction of its classes — a silently weakened gate. Domain-path sharding avoids this
  # because each shard's scope is defined by production-class location, not by test timing.
  # --covered-only --min=100 is intentionally preserved per shard: only classes with an
  # explicit covers()/mutates() declaration are mutated, so shards stay fast as long as that
  # declared surface stays small.
  #
  # Shard boundaries below were rebalanced using real timings pulled from the last 3 CI runs
  # of this matrix (gh api .../actions/runs/<id>/jobs), not guesswork:
  #   A · Actions                            ~9-12 min  (success every time)
  #   B · Http + Enums                       ~16-18 min (success every time)
  #   C · Services+Policies+Jobs+Models      ~22-25 min (hit its own 25 min timeout twice)
  #   D · Traits+DTO+Filters+misc            ~10-12 min (failed before completing — real
  #                                                       duration unknown, but not the slow one)
  # This directly contradicts the assumption that A (most files, 73) is the bottleneck — A was
  # consistently the fastest or second-fastest shard. Cross-referencing against how many classes
  # each old bucket actually has a covers()/mutates() declaration on (--covered-only only mutates
  # those) explains most, but not all, of it: old A=29 annotated classes but they're thin Action
  # classes with few mutants; old C=32 annotated classes (Services alone = 21) including CalDav
  # parsers and Google/Outlook/Apple calendar sync services — heavier logic, more mutants, slower
  # covering tests; old D=7 annotated classes total, meaning it was paying full job overhead
  # (checkout, PHP+Postgres setup) for almost no mutation work. B is the counter-example: only 9
  # annotated classes yet the 2nd-slowest shard (16-18 min, slower than A's 29). Annotated-class
  # count is a proxy, not a direct cost model — B proves it's an imperfect one. Rebalanced:
  #   A: unchanged (Actions) — already the fastest, no evidence it needs to change.
  #   B: unchanged (Http+Enums) — the anomaly above; left alone because there's no per-class
  #      timing data yet to say what to move off it, or where B's real cost comes from.
  #   C: narrowed to Services only (isolates the confirmed heaviest domain, drops Policies/
  #      Jobs/Models — the 11 annotated classes least likely to be Services-level expensive).
  #   D: absorbs Policies+Jobs+Models (11 annotated classes) plus everything it already had
  #      (7 annotated classes) — old D had spare time budget and almost nothing to mutate.
  # New annotated-class counts: A=29, B=9, C=21, D=18 (down from A=29, B=9, C=32, D=7) — C's
  # worst-case load drops by a third, D goes from near-idle to doing real work. This is a
  # hypothesis sized on annotated-class counts, not measured per-shard durations for the *new*
  # boundaries — treat the timeouts below as provisional and re-tune from real run data once
  # this shape has actually run. D's timeout is deliberately left at its old value (not lowered)
  # despite dropping directories: its old ~10-12 min was a *failing* run cut short by a test
  # failure, so its true completed duration under the old scope is unknown, and it now carries
  # 11 more annotated classes on top of that unknown baseline — tightening its timeout on that
  # basis would risk an avoidable red build.
  #
  # Each shard also restores/saves pest-plugin-mutate's own on-disk mutation cache (a
  # content-hash-keyed PSR SimpleCache FileStore — see vendor/pestphp/pest-plugin-mutate/src/
  # Cache/FileStore.php and src/Plugins/Mutate.php line ~102) across CI runs via actions/cache.
  # This cache lives at vendor/pestphp/pest-plugin-mutate/.temp/pest-mutate-cache and is wiped
  # every run today because vendor/ comes from a fresh `composer install` on every checkout —
  # the cache step below runs after that install, so it restores into a directory the mutate
  # plugin hasn't created yet on a cold runner; keep it in that order if this is ever refactored.
  # Its keys are file-content hashes + line numbers + mutator name, so a stale/prior-commit
  # cache can never produce an incorrect result for changed code — an entry only ever hits for
  # a file+mutator combination whose content is byte-identical to what was already tested, so
  # this cannot mask a regression. On the common case (a PR touching a handful of files), most
  # mutants across the whole app/ tree are unaffected and get skipped entirely. The cache key
  # includes github.run_id (always unique, so the post-job save always succeeds) with a
  # restore-keys prefix so each run restores the most recent previous state.
  mutation:
    name: '🦠 Mutation | ${{ matrix.shard.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.timeout }}

    services:
      postgres:
        image: postgres:17-alpine3.20
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: 'A', name: 'A · Actions',                       path: 'app/Actions',                                                                          timeout: 25 }
          - { id: 'B', name: 'B · Http + Enums',                   path: 'app/Http,app/Enums',                                                                    timeout: 25 }
          - { id: 'C', name: 'C · Services',                       path: 'app/Services',                                                                          timeout: 20 }
          - { id: 'D', name: 'D · Policies + Jobs + Models + misc', path: 'app/Policies,app/Jobs,app/Models,app/Traits,app/DTO,app/Filters,app/Filament,app/Providers,app/Observers,app/Support,app/Events,app/Broadcasting,app/Notifications,app/Casts', timeout: 25 }

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v6

      # No use-node here: the mutation matrix only runs `--testsuite=Unit`, and every test in
      # this project extends tests/TestCase.php, which calls `$this->withoutVite()` in setUp()
      # — Laravel's built-in helper that stubs the Vite facade entirely so `@vite()` directives
      # never touch the manifest. No Unit (or Feature) test needs public/build's compiled
      # assets, so `yarn install`/`yarn build` in setup-environment/action.yml is pure overhead
      # here — several minutes per shard, ×4 shards, for output nothing reads. The same is
      # almost certainly true of the `tests` job's Unit/Feature entries above (they call
      # setup-environment with use-node: true too), but that wasn't in scope for this change —
      # flagged as a follow-up rather than changed silently.
      - name: '⚙️ Prepare environment'
        uses: ./.github/actions/setup-environment

      - name: '🗄️ Grant CREATEDB permission'
        run: PGPASSWORD=db psql -h 127.0.0.1 -U db -d testing -c "ALTER USER db CREATEDB;"

      - name: '💽 Cache mutation testing results'
        uses: actions/cache@v5
        with:
          path: vendor/pestphp/pest-plugin-mutate/.temp/pest-mutate-cache
          key: "${{ runner.os }}-mutate-${{ matrix.shard.id }}-${{ github.run_id }}"
          restore-keys: '${{ runner.os }}-mutate-${{ matrix.shard.id }}-'

      - name: '${{ matrix.shard.name }} mutation tests'
        run: php artisan test --ci --testsuite=Unit --mutate --covered-only --min=100 --parallel --path=${{ matrix.shard.path }}
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: db
          DB_PASSWORD: db

name: '🪄 Mentor Wizard | 🚀 Deploy Current Branch'

on:
  workflow_dispatch:
  # No inputs as per requirements

jobs:
  build:
    name: Build Docker image
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.git.outputs.sha }}
    steps:
      - name: Fix permissions before checkout
        run: |
          if [ -d "/home/mw/actions-runner/_work/mentor-wizard-webapp/mentor-wizard-webapp" ]; then
            sudo chown -R $(id -u):$(id -g) /home/mw/actions-runner/_work/mentor-wizard-webapp/mentor-wizard-webapp || true
            sudo chmod -R 775 /home/mw/actions-runner/_work/mentor-wizard-webapp/mentor-wizard-webapp/storage || true
          fi
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Git SHA
        id: git
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: false
          load: true
          tags: mw-php-app:sha-${{ steps.git.outputs.sha }},mw-php-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: mw-staging
    needs: build
    environment:
      name: staging
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Fix permissions before checkout
        run: |
          if [ -d "/home/mw/actions-runner/_work/mentor-wizard-webapp/mentor-wizard-webapp" ]; then
            sudo chown -R $(id -u):$(id -g) /home/mw/actions-runner/_work/mentor-wizard-webapp/mentor-wizard-webapp || true
            sudo chmod -R 775 /home/mw/actions-runner/_work/mentor-wizard-webapp/mentor-wizard-webapp/storage || true
          fi
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
        shell: bash

      - name: Set Docker Compose file
        run: echo "COMPOSE_FILE=docker-compose.staging.yml" >> $GITHUB_ENV

      - name: Ensure storage permissions
        run: |
          mkdir -p storage/logs/nginx
          chmod -R 775 storage
          sudo chown -R $(id -u):$(id -g) storage
          touch storage/logs/nginx/error.log storage/logs/nginx/access.log
          chmod 664 storage/logs/nginx/*.log

      - name: Deploy Application
        env:
          UID: ${{ env.UID }}
          GID: ${{ env.GID }}
          DOCKER_IMAGE: "mw-php-app:sha-${{ env.IMAGE_TAG }}"
        run: |
          docker compose -f $COMPOSE_FILE down --remove-orphans
          if ! docker image inspect $DOCKER_IMAGE &>/dev/null; then
            DOCKER_IMAGE="mw-php-app:latest"
          fi
          DOCKER_IMAGE=$DOCKER_IMAGE docker compose --env-file .env -f $COMPOSE_FILE up -d
          docker compose --env-file .env -f $COMPOSE_FILE exec app php artisan down || true
          docker compose --env-file .env -f $COMPOSE_FILE exec app php artisan migrate --force
          docker compose --env-file .env -f $COMPOSE_FILE exec app php artisan optimize:clear
          docker compose --env-file .env -f $COMPOSE_FILE exec app php artisan optimize
          docker compose --env-file .env -f $COMPOSE_FILE exec app php artisan up

      - name: Health Check
        run: |
          for i in {1..5}; do
            if curl -sf https://staging.mentor-wizard.com/up; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed!"
          exit 1

      - name: Clean up unused Docker images
        run: |
          docker image prune -f
          docker image prune -a -f --filter "until=24h"

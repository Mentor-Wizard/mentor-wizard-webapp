name: '🚀 CD'

on:
  push:
    branches:
      - main
      - stage
      - develop

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: '${{ github.repository }}'

jobs:
  resolve:
    name: '🚦 Resolve'
    runs-on: ubuntu-latest
    outputs:
      tag:         ${{ steps.out.outputs.tag }}
      dockerfile:  ${{ steps.out.outputs.dockerfile }}
      environment: ${{ steps.out.outputs.environment }}
      deploy_name: ${{ steps.out.outputs.deploy_name }}

    steps:
      - name: '🚦 Resolve'
        id: out
        run: |
          case "${{ github.ref_name }}" in
            develop) tag=dev;    env=dev;   name="🟢 Dev";   file="docker/dev/php/Dockerfile"   ;;
            stage)   tag=stage;  env=stage; name="🟡 Stage"; file="docker/stage/php/Dockerfile" ;;
            main)    tag=latest; env=prod;  name="🔴 Prod";  file="docker/prod/php/Dockerfile"  ;;
          esac

          echo "tag=$tag"          >> $GITHUB_OUTPUT
          echo "dockerfile=$file"  >> $GITHUB_OUTPUT
          echo "environment=$env"  >> $GITHUB_OUTPUT
          echo "deploy_name=$name" >> $GITHUB_OUTPUT

  build-and-push:
    name: '🐳 Build & Push'
    runs-on: ubuntu-latest
    needs: resolve
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v6

      - name: '🔑 Log in to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: '🏷️ Extract metadata'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.resolve.outputs.tag }}

      - name: '⚙️ Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4

      - name: '🐳 Build and push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ needs.resolve.outputs.dockerfile }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            VITE_REVERB_APP_KEY=${{ vars.VITE_REVERB_APP_KEY }}
            VITE_REVERB_SCHEME=${{ vars.VITE_REVERB_SCHEME }}
            VITE_REVERB_HOST=${{ vars.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ vars.VITE_REVERB_PORT }}

  cleanup:
    name: '️🧹 Cleanup'
    runs-on: ubuntu-latest
    needs: [resolve, build-and-push]
    permissions: write-all
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: '🗑️ Delete old container versions'
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.event.repository.name }}'
          package-type: container
          delete-only-untagged-versions: true

      - name: '🗑 Delete deployment'
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ needs.resolve.outputs.environment }}
          onlyRemoveDeployments: true

      - name: '🗑 Delete workflow runs'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 1
          delete_workflow_pattern: cd.yml

  deploy:
    name: '🚀 Deploy | ${{ needs.resolve.outputs.deploy_name }}'
    runs-on: ubuntu-latest
    needs: [resolve, cleanup]
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: '🌐 Dokploy | ${{ needs.resolve.outputs.deploy_name }}'
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          api_token: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          service_type: compose
